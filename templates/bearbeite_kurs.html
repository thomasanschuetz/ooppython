<!DOCTYPE html>
<html>
<head>
    <title>Kurs bearbeiten</title>
</head>
<body>
    <h1>Kurs bearbeiten</h1>
    <form action="/bearbeite_kurs" method="POST">
        <input type="hidden" name="id" value="{{ kurs.id }}"/>
        <label for="name">Name</label>
        <input type="text" name="name" required value="{{ kurs.name }}"/>
        
        <label for="ects">ECTS</label>
        <input type="number" name="ects" min="1" max="20" required value="{{ kurs.ects }}"/>
        
        <label for="schwere">Schwere</label>
        <input type="number" name="schwere" min="1" max="5" required value="{{ kurs.schwere }}"/>
        
        <input type="submit" name="speichern" value="Speichern"/>
        
    </form>
</body>
</html>
