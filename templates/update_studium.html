<!DOCTYPE html>
<html>
<head>
    <title>Studium bearbeiten</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <h1>Studium bearbeiten</h1>
    <a href="/" class="button">Zurück</a>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="errors">
                {% for category, message in messages %}
                    <div class="error">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    <form action="/update_studium" method="POST">
        <label for="name">Name</label>
        <input type="text" name="name" required value="{{ name }}"/>
        <label for="beginn">Beginn</label>
        <input type="date" name="beginn"  required value="{{ beginn }}"/>
        <label for="ziel_note">Ziel-Note</label>
        <input type="number" name="ziel_note" min="1" max="6" step="0.01" required value="{{ ziel_note }}"/>
        <label for="ziel_monate">Ziel-Monate</label>
        <input type="number" name="ziel_monate" min="1" max="120" required value="{{ ziel_monate }}"/>
        
        <input type="submit" value="Speichern"/>
        
    </form>
</body>
</html>
